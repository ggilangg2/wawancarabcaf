<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wawancara Konsumen</title>
<link rel="manifest" href="manifest.json?v=3">
<meta name="theme-color" content="#1d5fd6">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<script src="jspdf.min.js"></script>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#14213d;--mut:#5b6b88;--pri:#1d5fd6;--pri2:#e3edff;--bd:#d9e2f1;--dng:#c0392b;--hero:#1d5fd6;--ht:#fff;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1322;--card:#15203a;--tx:#e8eefb;--mut:#9fb0cf;--pri:#5b9bff;--pri2:#1e305a;--bd:#263759;--dng:#ff7b6b;--hero:#1b2c52;--ht:#e8eefb;--bt:#0b1322}}
:root[data-theme="dark"]{--bg:#0b1322;--card:#15203a;--tx:#e8eefb;--mut:#9fb0cf;--pri:#5b9bff;--pri2:#1e305a;--bd:#263759;--dng:#ff7b6b;--hero:#1b2c52;--ht:#e8eefb;--bt:#0b1322}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.hero{background:var(--hero);color:var(--ht);padding:18px 18px 46px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:22px;margin:0 0 2px}.hero p{margin:0;opacity:.8;font-size:14px}
.tg{background:rgba(255,255,255,.18);color:var(--ht);border:0;border-radius:20px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
main{max-width:640px;margin:-30px auto 0;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 24px));background:var(--card);border:1px solid var(--bd);border-radius:28px;display:flex;padding:6px;gap:4px;z-index:5;box-shadow:0 6px 20px rgba(10,30,70,.18)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;border-radius:22px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{background:var(--pri);color:var(--bt);font-weight:600}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.btn{background:var(--pri);color:var(--bt);border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.dng{background:transparent;color:var(--dng);border:1px solid var(--dng)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:110px}
.mut{color:var(--mut);font-size:14px}.q{font-weight:600}
.big{font-size:19px;font-weight:600;margin:0 0 14px;line-height:1.35}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.item{display:flex;align-items:center;gap:12px;cursor:pointer}.item>div:nth-child(2){flex:1;min-width:0}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:8px;padding:2px 9px;font-size:12px}
.tile{border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.tile.on{border-color:var(--pri);background:var(--pri2)}
.pb{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}.pb i{display:block;height:100%;background:var(--pri);transition:width .3s}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dots b{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
.dots b.dn{background:var(--pri2);color:var(--pri);border-color:var(--pri2)}.dots b.cur{background:var(--pri);color:var(--bt);border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);border-radius:20px;padding:10px 16px;cursor:pointer;background:var(--card)}
.chip.on{background:var(--pri);color:var(--bt);border-color:var(--pri);font-weight:600}
.sc{display:flex;gap:8px}.sc .chip{flex:1;text-align:center;padding:14px 0;border-radius:14px;font-size:18px}
.sl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.slide{animation:sl .25s ease}@keyframes sl{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.qe{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--bg)}
.qe .r{display:flex;gap:6px;margin-top:8px}
.ans{white-space:pre-wrap;margin:2px 0 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="hero"><div><h1 id="ttl"></h1><p id="sub"></p></div><button class="tg" id="thm">Terang / Gelap</button></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const TL={short:'Teks singkat',long:'Teks panjang',choice:'Pilihan tunggal',multi:'Pilihan ganda (bisa banyak)',scale:'Skala 1-5',yesno:'Ya / Tidak',number:'Angka'};
const Q=(q,t,o)=>({q,t:t||'long',o:o||[]});
const defT=[
{id:'t1',name:'Pengusaha',q:[Q('Apa jenis usaha yang dijalankan?','short'),Q('Sudah berapa lama usaha berjalan (tahun)?','number'),Q('Dari mana pelanggan Anda biasanya datang?','multi',['Media sosial','Marketplace','Relasi','Offline']),Q('Seberapa besar kendala usaha Anda saat ini?','scale'),Q('Apa kendala terbesar Anda?','long')]},
{id:'t2',name:'Karyawan',q:[Q('Apa pekerjaan dan posisi Anda?','short'),Q('Kisaran budget bulanan','choice',['< 500 rb','500 rb - 1 jt','1 - 3 jt','> 3 jt']),Q('Apakah Anda butuh solusi ini segera?','yesno'),Q('Apa yang Anda pertimbangkan sebelum membeli?','long')]},
{id:'t3',name:'Umum',q:[Q('Dari mana Anda mengetahui kami?','choice',['Teman','Media sosial','Iklan','Lainnya']),Q('Apa kebutuhan Anda saat ini?','long'),Q('Seberapa yakin Anda untuk membeli?','scale')]}];
const mig=l=>l.map(t=>({...t,q:t.q.map(x=>typeof x==='string'?Q(x):x)}));
let S={tab:'w',tpls:mig(ld('wk_tpls',defT)),hist:ld('wk_hist',[]).map(h=>({...h,answers:h.answers.map(a=>({t:'long',o:[],...a}))})),draft:null,step:0,sel:null,det:null,te:null,q:'',cd:null};
const save=()=>{sv('wk_tpls',S.tpls);sv('wk_hist',S.hist)};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('wk_theme',t)}catch(e){}}
try{const t=localStorage.getItem('wk_theme');if(t)setTheme(t)}catch(e){}
$('#thm').onclick=()=>{const d=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');setTheme(d==='dark'?'light':'dark')};
const go=t=>{S.tab=t;S.cd=null;render()};
const fmt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const has=a=>Array.isArray(a)?a.length>0:(a!==undefined&&a!==''&&a!==null);
const fa=a=>!has(a.a)?'':Array.isArray(a.a)?a.a.join(', '):a.t==='scale'?a.a+' / 5':a.a;
const IC={w:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/>',h:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',t:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};

function render(){
  const m={w:['Wawancara',S.draft?'Isi jawaban satu per satu':'Catat kebutuhan konsumen'],h:['Riwayat',S.hist.length+' hasil wawancara'],t:['Template','Atur pertanyaan per profil konsumen']}[S.tab];
  $('#ttl').textContent=m[0];$('#sub').textContent=m[1];
  $('#nav').innerHTML=[['w','Wawancara'],['h','Hasil'],['t','Template']].map(([k,v])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg>${v}</button>`).join('');
  $('#app').innerHTML=S.tab==='w'?vW():S.tab==='h'?vH():vT();
  window.scrollTo(0,0);
}

/* ---------- Wawancara ---------- */
function vW(){
  const d=S.draft;
  if(!d){
    if(!S.tpls.length)return `<div class="card"><p>Belum ada template.</p><button class="btn" onclick="go('t')">Buat template</button></div>`;
    const sel=S.sel||S.tpls[0].id;
    return `<div class="card"><label style="margin-top:0">Nama konsumen</label><input id="cn" value="${esc(S.kn||'')}" placeholder="Nama lengkap">
    <label>No. HP / WhatsApp (opsional)</label><input id="cp" value="${esc(S.kp||'')}" inputmode="tel" placeholder="08xxxxxxxxxx">
    <label>Pilih profil konsumen</label>
    ${S.tpls.map(t=>`<div class="tile ${t.id===sel?'on':''}" onclick="S.sel='${t.id}';keep();render()"><div class="av">${esc((t.name[0]||'?').toUpperCase())}</div><div><div class="q">${esc(t.name)}</div><div class="mut">${t.q.length} pertanyaan</div></div></div>`).join('')}
    <button class="btn" style="width:100%;margin-top:6px" onclick="startW()">Mulai wawancara</button></div>`;
  }
  const n=d.answers.length,a=d.answers[S.step];
  return `<div class="card"><div class="item" style="cursor:default"><div class="av">${esc(d.name[0].toUpperCase())}</div><div><div class="q">${esc(d.name)}</div><div class="mut">${esc(d.tname)}</div></div></div></div>
  <div class="card"><div class="mut">Pertanyaan ${S.step+1} dari ${n}</div><div class="pb"><i style="width:${(S.step+1)/n*100}%"></i></div>
  <div class="dots">${d.answers.map((x,i)=>`<b class="${i===S.step?'cur':has(x.a)?'dn':''}" onclick="S.step=${i};render()">${i+1}</b>`).join('')}</div>
  <div class="slide" id="qa"><p class="big">${esc(a.q)}</p>${inp(a,S.step)}</div>
  ${S.step===n-1?`<label>Catatan tambahan</label><textarea style="min-height:70px" oninput="S.draft.note=this.value">${esc(d.note||'')}</textarea>`:''}
  <div class="row"><button class="btn alt" onclick="${S.step?'S.step--;render()':'cancelW()'}">${S.step?'Kembali':'Batal'}</button><button class="btn" onclick="${S.step<n-1?'S.step++;render()':'saveW()'}">${S.step<n-1?'Lanjut':'Simpan'}</button></div></div>`;
}
function keep(){const a=$('#cn'),b=$('#cp');S.kn=a?a.value:'';S.kp=b?b.value:''}
function inp(a,i){
  const v=a.a;
  if(a.t==='short')return `<input value="${esc(v||'')}" placeholder="Jawaban singkat" oninput="S.draft.answers[${i}].a=this.value">`;
  if(a.t==='number')return `<input type="number" inputmode="decimal" value="${esc(v||'')}" placeholder="0" oninput="S.draft.answers[${i}].a=this.value">`;
  if(a.t==='yesno')return `<div class="sc">${['Ya','Tidak'].map(o=>`<div class="chip ${v===o?'on':''}" onclick="sa(${i},'${o}')">${o}</div>`).join('')}</div>`;
  if(a.t==='scale')return `<div class="sc">${[1,2,3,4,5].map(o=>`<div class="chip ${v===o?'on':''}" onclick="sa(${i},${o})">${o}</div>`).join('')}</div><div class="sl"><span>Rendah</span><span>Tinggi</span></div>`;
  if(a.t==='choice')return `<div class="chips">${a.o.map((o,j)=>`<div class="chip ${v===o?'on':''}" onclick="sa(${i},${j})">${esc(o)}</div>`).join('')}</div>`;
  if(a.t==='multi')return `<div class="chips">${a.o.map((o,j)=>`<div class="chip ${(v||[]).includes(o)?'on':''}" onclick="sm(${i},${j})">${esc(o)}</div>`).join('')}</div>`;
  return `<textarea placeholder="Tulis jawaban" oninput="S.draft.answers[${i}].a=this.value">${esc(v||'')}</textarea>`;
}
function sa(i,v){const a=S.draft.answers[i];a.a=a.t==='choice'?a.o[v]:v;render0()}
function sm(i,j){const a=S.draft.answers[i],o=a.o[j],l=a.a||[];a.a=l.includes(o)?l.filter(x=>x!==o):[...l,o];render0()}
function render0(){const a=S.draft.answers[S.step];$('#qa').innerHTML=`<p class="big">${esc(a.q)}</p>${inp(a,S.step)}`;document.querySelectorAll('.dots b').forEach((b,i)=>{b.className=i===S.step?'cur':has(S.draft.answers[i].a)?'dn':''})}
function startW(){
  const name=$('#cn').value.trim();if(!name){toast('Isi nama konsumen dulu');return}
  const t=S.tpls.find(x=>x.id===(S.sel||S.tpls[0].id))||S.tpls[0];
  if(!t.q.length){toast('Template ini belum punya pertanyaan');return}
  S.draft={id:uid(),name,phone:$('#cp').value.trim(),tname:t.name,date:Date.now(),note:'',answers:t.q.map(q=>({q:q.q,t:q.t,o:[...q.o],a:q.t==='multi'?[]:''}))};S.step=0;S.kn='';S.kp='';render();
}
function cancelW(){S.draft=null;render()}
function saveW(){
  const i=S.hist.findIndex(h=>h.id===S.draft.id);
  if(i>=0)S.hist[i]=S.draft;else S.hist.unshift(S.draft);
  save();S.det=S.draft.id;S.draft=null;toast('Tersimpan');go('h');
}

/* ---------- Hasil & Riwayat ---------- */
function vH(){
  if(S.det){
    const h=S.hist.find(x=>x.id===S.det);if(!h){S.det=null;return vH()}
    return `<div class="card"><div class="item" style="cursor:default"><div class="av">${esc(h.name[0].toUpperCase())}</div><div><div class="q">${esc(h.name)}</div><div class="mut">${esc(h.tname)} · ${fmt(h.date)}${h.phone?' · '+esc(h.phone):''}</div></div></div></div>
    <div class="card">${h.answers.map((a,i)=>`<div class="mut">${i+1}. ${esc(a.q)}</div><p class="ans q">${esc(fa(a))||'<span class="mut" style="font-weight:400">(belum dijawab)</span>'}</p>`).join('')}
    ${h.note?`<div class="mut">Catatan</div><p class="ans">${esc(h.note)}</p>`:''}</div>
    <div class="row"><button class="btn" onclick="sharePdf('${h.id}')">Bagikan PDF</button><button class="btn alt" onclick="shareTxt('${h.id}')">Bagikan Teks</button></div>
    <div class="row"><button class="btn alt" onclick="editH('${h.id}')">Edit</button><button class="btn dng" onclick="delH('${h.id}')">${S.cd===h.id?'Ketuk lagi untuk hapus':'Hapus'}</button><button class="btn alt" onclick="S.det=null;render()">Tutup</button></div>`;
  }
  return `<input placeholder="Cari nama konsumen" value="${esc(S.q)}" oninput="S.q=this.value;sr()" style="margin-bottom:12px"><div id="hl">${hl()}</div>`;
}
function hl(){
  const q=S.q.toLowerCase(),l=S.hist.filter(h=>!q||h.name.toLowerCase().includes(q)||h.tname.toLowerCase().includes(q));
  return l.length?l.map(h=>`<div class="card item" onclick="S.det='${h.id}';render()"><div class="av">${esc(h.name[0].toUpperCase())}</div><div><div class="q">${esc(h.name)}</div><div class="mut">${fmt(h.date)} · ${h.answers.filter(a=>has(a.a)).length}/${h.answers.length} terjawab</div></div><span class="tag">${esc(h.tname)}</span></div>`).join(''):`<div class="card mut">Belum ada hasil wawancara.</div>`}
function sr(){$('#hl').innerHTML=hl()}
function editH(id){S.draft=JSON.parse(JSON.stringify(S.hist.find(h=>h.id===id)));S.step=0;go('w')}
function delH(id){if(S.cd!==id){S.cd=id;render();return}S.hist=S.hist.filter(h=>h.id!==id);S.det=null;S.cd=null;save();render();toast('Dihapus')}
function toText(h){return `WAWANCARA KONSUMEN\nNama: ${h.name}\nProfil: ${h.tname}\nTanggal: ${fmt(h.date)}${h.phone?'\nHP: '+h.phone:''}\n\n`+h.answers.map((a,i)=>`${i+1}. ${a.q}\n${fa(a)||'-'}`).join('\n\n')+(h.note?`\n\nCatatan:\n${h.note}`:'')}
async function shareTxt(id){
  const h=S.hist.find(x=>x.id===id),t=toText(h);
  try{if(navigator.share){await navigator.share({title:'Wawancara '+h.name,text:t});return}}catch(e){if(e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
async function sharePdf(id){
  const h=S.hist.find(x=>x.id===id);
  if(!window.jspdf){toast('Library PDF belum termuat, coba lagi');return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  let y=18;const W=doc.internal.pageSize.getWidth()-30,H=doc.internal.pageSize.getHeight()-15;
  const put=(t,sz,b)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);doc.splitTextToSize(String(t),W).forEach(l=>{if(y>H){doc.addPage();y=18}doc.text(l,15,y);y+=sz*0.5})};
  put('Wawancara Konsumen',16,1);y+=2;put('Nama: '+h.name,11);put('Profil: '+h.tname,11);put('Tanggal: '+fmt(h.date),11);if(h.phone)put('HP: '+h.phone,11);y+=4;
  h.answers.forEach((a,i)=>{put((i+1)+'. '+a.q,11,1);put(fa(a)||'-',11);y+=3});
  if(h.note){put('Catatan',11,1);put(h.note,11)}
  const fn='Wawancara-'+h.name.replace(/\s+/g,'-')+'.pdf';
  const file=new File([doc.output('blob')],fn,{type:'application/pdf'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});return}
    doc.save(fn);toast('PDF dibuat. Jika tidak terunduh, gunakan Bagikan Teks')
  }catch(e){if(e.name!=='AbortError')toast('Gagal membagikan PDF, coba Bagikan Teks')}
}

/* ---------- Template ---------- */
function vT(){
  if(S.te){
    const t=T(S.te);if(!t){S.te=null;return vT()}
    return `<div class="card"><label style="margin-top:0">Nama template / profil konsumen</label><input value="${esc(t.name)}" oninput="tn('${t.id}',this.value)">
    <label>Pertanyaan (${t.q.length})</label>
    ${t.q.map((q,i)=>`<div class="qe"><input value="${esc(q.q)}" placeholder="Tulis pertanyaan" oninput="tq('${t.id}',${i},this.value)">
    <select style="margin-top:8px" onchange="tt('${t.id}',${i},this.value)">${Object.entries(TL).map(([k,v])=>`<option value="${k}" ${q.t===k?'selected':''}>${v}</option>`).join('')}</select>
    ${q.t==='choice'||q.t==='multi'?`<textarea style="min-height:84px;margin-top:8px" placeholder="Satu pilihan per baris" oninput="to('${t.id}',${i},this.value)">${esc(q.o.join('\n'))}</textarea>`:''}
    <div class="r"><button class="btn alt sm" onclick="mv('${t.id}',${i},-1)">Naik</button><button class="btn alt sm" onclick="mv('${t.id}',${i},1)">Turun</button><button class="btn dng sm" onclick="dq('${t.id}',${i})">Hapus</button></div></div>`).join('')}
    <div class="row"><button class="btn alt" onclick="aq('${t.id}')">+ Tambah pertanyaan</button></div></div>
    <div class="row"><button class="btn" onclick="S.te=null;save();render()">Selesai</button></div>`;
  }
  return `<button class="btn" onclick="nt()" style="width:100%;margin-bottom:12px">+ Template baru</button>`+S.tpls.map(t=>`<div class="card"><div class="item" onclick="S.te='${t.id}';render()"><div class="av">${esc((t.name[0]||'?').toUpperCase())}</div><div><div class="q">${esc(t.name)}</div><div class="mut">${t.q.length} pertanyaan</div></div><span class="tag">Edit</span></div>
  <div class="row"><button class="btn alt sm" onclick="dt('${t.id}')">Duplikat</button><button class="btn dng sm" onclick="xt('${t.id}')">${S.cd===t.id?'Ketuk lagi untuk hapus':'Hapus'}</button></div></div>`).join('');
}
const T=id=>S.tpls.find(x=>x.id===id);
function tn(id,v){T(id).name=v;save()}
function tq(id,i,v){T(id).q[i].q=v;save()}
function tt(id,i,v){T(id).q[i].t=v;if((v==='choice'||v==='multi')&&!T(id).q[i].o.length)T(id).q[i].o=['Pilihan 1','Pilihan 2'];save();render()}
function to(id,i,v){T(id).q[i].o=v.split('\n').map(x=>x.trim()).filter(Boolean);save()}
function aq(id){T(id).q.push(Q('', 'short'));save();render()}
function dq(id,i){T(id).q.splice(i,1);save();render()}
function mv(id,i,d){const q=T(id).q,j=i+d;if(j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];save();render()}
function nt(){const t={id:uid(),name:'Template baru',q:[Q('','short')]};S.tpls.push(t);S.te=t.id;save();render()}
function dt(id){const t=T(id);S.tpls.push({id:uid(),name:t.name+' (salinan)',q:JSON.parse(JSON.stringify(t.q))});save();render();toast('Template diduplikat')}
function xt(id){if(S.cd!==id){S.cd=id;render();return}S.tpls=S.tpls.filter(t=>t.id!==id);S.cd=null;save();render()}
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
